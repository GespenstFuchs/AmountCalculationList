<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>金額計算リスト</title>
    <link rel="icon" href="data:,">
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.min.css">
</head>

<body class="preload">
    <div class="app">
        <div class="safe-top"></div>

        <div class="total">合計： <span id="totalAmount">¥0</span></div>
        <div id="list" class="list"></div>
        <div class="input-row">
            <label for="date">日付：</label>
            <input id="date">
        </div>
        <div class="input-row">
            <label for="yen">金額：</label>
            <input id="yen" class="yen-input" inputmode="numeric">
            <button id="toggleMinusButton" class="minus-button">－</button>
        </div>
        <div class="input-row">
            <label for="memo">メモ：</label>
            <input id="memo">
        </div>
        <div class="action-bar-container">
            <div class="action-bar">
                <div id="addButton" class="action-button">
                    <span class="icon">📝</span>
                    <span class="label">追加</span>
                </div>
                <div id="saveButton" class="action-button disabled">
                    <span class="icon">💾</span>
                    <span class="label">保存</span>
                </div>
                <div id="deleteButton" class="action-button disabled">
                    <span class="icon">🗑️</span>
                    <span class="label">削除</span>
                </div>
                <div id="clearButton" class="action-button">
                    <span class="icon">🧹</span>
                    <span class="label">クリア</span>
                </div>
                <div id="allDeleteButton" class="action-button disabled">
                    <span class="icon">💣</span>
                    <span class="label">全削除</span>
                </div>
            </div>
        </div>

        <div class="safe-bottom"></div>
    </div>

    <!-- カスタムトースト -->
    <div id="customToast"></div>

    <!-- カスタム確認ダイアログ -->
    <div id="customConfirmOverlay" class="confirm-overlay">
        <div class="confirm-dialog">
            <div class="confirm-icon">💣</div>
            <div id="confirmMessage" class="confirm-message">メッセージ</div>
            <div class="confirm-buttons">
                <button id="confirmOkButton" class="confirm-button ok-button">ＯＫ</button>
                <button id="confirmCancelButton" class="confirm-button cancel-button">キャンセル</button>
            </div>
        </div>
    </div>
</body>
</html>
