<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>金額計算リスト</title>
    <link rel="icon" href="data:,">
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.min.css">
</head>

<body class="preload">
    <div class="app">
        <div class="safe-top"></div>

        <div class="total">合計： <span id="totalAmount">¥0</span></div>
        <div id="list" class="list"></div>
        <div class="input-row">
            <label for="date">日付：</label>
            <input id="date">
        </div>
        <div class="input-row">
            <label for="yen">金額：</label>
            <input id="yen" class="yen-input" inputmode="numeric">
            <button id="toggleMinusButton" class="minus-button">－</button>
        </div>
        <div class="input-row">
            <label for="memo">メモ：</label>
            <input id="memo">
        </div>
        <div class="buttons">
            <button id="addButton">📝 追加</button>
            <button id="saveButton" disabled>️💾 保存</button>
        </div>
        <div class="buttons">
            <button id="deleteButton" disabled>🗑️ 削除</button>
        </div>

        <div id="customToast"></div>

        <div class="safe-bottom"></div>
    </div>
</body>
</html>
